<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin | Crediário São Pedro</title>
    <link rel="stylesheet" href="admin.css">
</head>

<body>
    <header><a href="index.html">✦ CREDIÁRIO SÃO PEDRO</a><span>Painel administrativo</span><button id="logout"
            hidden>Sair</button></header>
    <main>
        <section id="loginView" class="login card">
            <h1>Acesso administrativo</h1>
            <p>Entre com o e-mail e senha cadastrados no Supabase.</p>
            <form id="loginForm"><label>E-mail<input id="email" type="email" autocomplete="username"
                        required></label><label>Senha<input id="password" type="password"
                        autocomplete="current-password" required></label><button type="submit">Entrar no painel</button>
            </form>
            <p id="loginMsg" role="status"></p>
        </section>
        <section id="dashboard" hidden>
            <div class="heading">
                <div>
                    <h1>Gerenciar móveis</h1>
                    <p>Atualize preços, fotos e estoque. Alterações salvas aparecem no catálogo.</p>
                </div><button id="newProduct">+ Novo produto</button>
            </div>
            <div class="metrics">
                <div class="card"><small>Produtos</small><strong id="total">—</strong></div>
                <div class="card"><small>Com estoque</small><strong id="available">—</strong></div>
                <div class="card"><small>Esgotados</small><strong id="sold">—</strong></div>
            </div>
            <div class="card">
                <div class="toolbar"><input id="filter" type="search" placeholder="Buscar produto ou fabricante"><button
                        id="refresh" class="secondary">Atualizar</button></div>
                <div id="items" class="items"></div>
            </div>
        </section>
        <section id="editor" class="card" hidden>
            <div class="heading">
                <h2 id="editorTitle">Editar produto</h2><button id="cancel" class="secondary">Voltar</button>
            </div>
            <form id="productForm">
                <div class="fields"><label>Nome<input id="nome" required maxlength="180"></label><label>Fabricante<input
                            id="fabricante" maxlength="100"></label><label>Categoria<input id="categoria" required
                            maxlength="100"></label><label>Preço (R$)<input id="preco" type="number" step="0.01" min="0"
                            placeholder="Deixe vazio para consultar"></label><label>Quantidade disponível<input
                            id="quantidade" type="number" min="0" step="1" required></label><label>Foto nova (JPG, PNG,
                        WebP; até 5 MB)<input id="foto" type="file" accept="image/jpeg,image/png,image/webp"></label>
                </div><label>Descrição<textarea id="descricao" rows="4"></textarea></label><label class="check"><input
                        id="ativo" type="checkbox" checked> Visível no catálogo</label><img id="preview"
                    alt="Prévia da imagem" hidden>
                <div class="actions"><button type="submit" id="save">Salvar alterações</button><button type="button"
                        id="delete" class="danger" hidden>Excluir produto</button></div>
                <p id="editorMsg" role="status"></p>
            </form>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabase-config.js"></script>
    <script src="admin.js"></script>
</body>

</html>
